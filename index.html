<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <title>Itaitinga MTB Race — Minha Foto de Atleta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="brand">ITAITINGA MTB RACE</div>
        <h1>MINHA FOTO DE ATLETA</h1>
      </div>
      <div class="counter" id="counter">1 de 2</div>
    </header>

    <section class="preview-card">
      <div class="preview-wrap">
        <div class="preview-stage" id="previewStage" aria-label="Prévia da foto">
          <canvas id="previewCanvas"></canvas>
          <div class="empty-state" id="emptyState">
            <button class="choose-button" id="chooseButton" type="button" aria-label="Escolher sua foto">
              <span class="plus">+</span>
              <strong>Escolha sua foto</strong>
              <small>Toque no botão para selecionar uma imagem</small>
            </button>
          </div>
          <input id="fileInput" type="file" accept="image/*" hidden>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="control-row">
        <button class="secondary" id="resetButton" type="button">↻ <strong>Reajustar</strong></button>
        <button class="secondary" id="centerButton" type="button">⊙ <strong>Centralizar</strong></button>
      </div>

      <div class="zoom-row">
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range" min="60" max="180" value="100" step="1">
        <output id="zoomValue">100%</output>
      </div>

      <div class="where">Onde você vai postar?</div>
      <div class="format-row">
        <button class="format" id="feedButton" type="button">
          <span>📸 <strong>Feed / Post</strong></span>
          <small>4:5</small>
        </button>
        <button class="format active" id="storyButton" type="button">
          <span>📱 <strong>Story</strong></span>
          <small>9:16</small>
        </button>
      </div>

      <button class="download" id="downloadButton" type="button">↓ Baixar foto</button>
      <p class="hint" id="hint">Toque em “Escolha sua foto” para começar.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
